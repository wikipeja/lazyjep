<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lazyjep</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for parsing Markdown from the AI response -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rock+Salt&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Custom Markdown Styles */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #111827;
        }
        .markdown-body p {
            margin-bottom: 1em;
            line-height: 1.6;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .markdown-body li {
            margin-bottom: 0.5em;
            line-height: 1.6;
        }
        .markdown-body strong {
            font-weight: 600;
            color: #111827;
        }
        
        /* Spinner Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }

        /* Progress Bar Animation */
        @keyframes progress-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-progress {
            animation: progress-slide 1.5s infinite linear;
        }

        /* Sleeping Wizard Animations */
        @keyframes breathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.05); }
        }
        .wizard-body {
            animation: breathe 3s ease-in-out infinite;
            transform-origin: 50px 65px; /* Center of the face */
        }

        @keyframes float-wand {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }
        .floating-wand {
            animation: float-wand 4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes snore-anim {
            0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(15px, -30px) scale(1.2); }
        }
        .snore { opacity: 0; animation: snore-anim 3.5s infinite linear; }
        .snore-1 { animation-delay: 0s; }
        .snore-2 { animation-delay: 1.1s; }
        .snore-3 { animation-delay: 2.2s; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .sparkle { animation: twinkle 2s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2 text-gray-900">
                <svg class="w-8 h-8" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(0, 10)">
                        <!-- Head -->
                        <circle cx="50" cy="60" r="25" fill="#f3f4f6" stroke="#4b5563" stroke-width="3" />
                        <!-- Face: -_- -->
                        <line x1="35" y1="60" x2="45" y2="60" stroke="#4b5563" stroke-width="3" stroke-linecap="round" />
                        <line x1="55" y1="60" x2="65" y2="60" stroke="#4b5563" stroke-width="3" stroke-linecap="round" />
                        <line x1="43" y1="72" x2="57" y2="72" stroke="#4b5563" stroke-width="3" stroke-linecap="round" />
                        <!-- Hat Brim -->
                        <ellipse cx="50" cy="38" rx="40" ry="9" fill="#374151" />
                        <!-- Hat Cone -->
                        <path d="M 15 38 Q 50 -10 50 -10 Q 55 15 85 38 Z" fill="#4b5563" />
                    </g>
                </svg>
                <h1 class="text-xl font-semibold text-gray-800 tracking-wide" style="font-family: 'Rock Salt', cursive;">lazyjep</h1>
            </div>
            <button onclick="togglePromptSettings()" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-1 transition-colors">
                <i class="ph ph-gear"></i> View prompt rules
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8 flex flex-col md:flex-row gap-6">
        
        <!-- Left Column: Input -->
        <div class="w-full md:w-1/2 flex flex-col gap-4 md:sticky md:top-24 self-start">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex-grow flex flex-col">
                <label for="draftInput" class="block text-sm font-semibold text-gray-700 mb-2 flex justify-between items-center">
                    <span>Your rough draft</span>
                    <button onclick="clearInput()" class="text-xs text-gray-400 hover:text-gray-800 transition-colors">Clear</button>
                </label>

                <textarea id="draftInput" 
                    class="w-full flex-grow min-h-[250px] p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none resize-none transition-all text-sm"
                    placeholder="Paste your rough thoughts, messy notes, or long draft here..."></textarea>
                
                <button id="simplifyBtn" onclick="processDraft()" class="mt-4 w-full bg-gray-900 hover:bg-black text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors relative">
                    <i class="ph-bold ph-sparkle"></i>
                    <span>Simplify & improve</span>
                    <span class="hidden sm:inline-block text-[10px] text-gray-400 font-normal absolute right-4 border border-gray-700 px-1.5 py-0.5 rounded tracking-wide uppercase">Alt+Enter</span>
                </button>
            </div>

            <!-- Hidden Prompt Settings Panel -->
            <div id="promptSettings" class="hidden bg-gray-50 p-5 rounded-xl border border-gray-200 text-sm">
                <h3 class="font-semibold text-gray-800 mb-2 flex items-center gap-1">
                    <i class="ph ph-terminal-window"></i> System prompt instructions
                </h3>
                <p class="text-gray-500 mb-3 text-xs">These are the strict instructions sent to the AI alongside your draft, saved as requested.</p>
                <div class="bg-gray-900 text-gray-100 p-3 rounded text-xs font-mono whitespace-pre-wrap leading-relaxed" id="promptDisplay"></div>
            </div>
        </div>

        <!-- Right Column: Output -->
        <div class="w-full md:w-1/2 flex flex-col">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex-grow flex flex-col relative h-full min-h-[400px]">
                <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                    <h2 class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                        <i class="ph-fill ph-check-circle text-gray-700"></i> Refined result
                    </h2>
                    <button onclick="copyOutput()" id="copyBtn" class="hidden text-xs font-medium text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 py-1 px-2 rounded transition-colors flex items-center gap-1">
                        <i class="ph ph-copy"></i> Copy
                    </button>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="flex-grow flex flex-col items-center justify-center text-gray-400">
                    <i class="ph ph-article text-4xl mb-2 text-gray-300"></i>
                    <p class="text-sm">Your improved and simplified thought will appear here.</p>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="hidden flex-grow flex flex-col items-center justify-center text-gray-600 w-full px-8">
                    <!-- Sleeping Wizard Mascot -->
                    <svg class="w-32 h-32 mb-2" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- Snoring Zzz's -->
                        <g class="snore snore-3"><text x="75" y="30" font-family="Inter, sans-serif" font-weight="bold" font-size="22" fill="#9ca3af">Z</text></g>
                        <g class="snore snore-2"><text x="60" y="45" font-family="Inter, sans-serif" font-weight="bold" font-size="16" fill="#d1d5db">z</text></g>
                        <g class="snore snore-1"><text x="45" y="55" font-family="Inter, sans-serif" font-weight="bold" font-size="12" fill="#e5e7eb">z</text></g>
                        
                        <!-- Wizard Body (Breathing) -->
                        <g class="wizard-body">
                            <!-- Head -->
                            <circle cx="50" cy="65" r="22" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" />
                            <!-- Face: -_- -->
                            <line x1="38" y1="65" x2="46" y2="65" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" />
                            <line x1="54" y1="65" x2="62" y2="65" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" />
                            <line x1="45" y1="75" x2="55" y2="75" stroke="#4b5563" stroke-width="2" stroke-linecap="round" />
                            
                            <!-- Hat Brim -->
                            <ellipse cx="50" cy="45" rx="35" ry="8" fill="#374151" />
                            <!-- Hat Cone -->
                            <path d="M 20 45 Q 50 5 50 5 Q 55 25 80 45 Z" fill="#4b5563" />
                        </g>
            
                        <!-- Floating Wand -->
                        <g class="floating-wand">
                            <!-- Wand Stick -->
                            <line x1="75" y1="105" x2="95" y2="45" stroke="#6b7280" stroke-width="4" stroke-linecap="round" />
                            <!-- Magic Star -->
                            <polygon points="95,35 98,43 107,43 100,48 103,56 95,51 87,56 90,48 83,43 92,43" fill="#1f2937" />
                            <!-- Sparkles -->
                            <circle cx="110" cy="35" r="2.5" fill="#9ca3af" class="sparkle" />
                            <circle cx="80" cy="30" r="1.5" fill="#9ca3af" class="sparkle" style="animation-delay: 1s;" />
                        </g>
                    </svg>

                    <p class="text-sm font-medium mb-4 text-center text-gray-500">Improving and simplifying your draft...</p>
                    <div class="w-full max-w-xs bg-gray-200 rounded-full h-1.5 overflow-hidden relative">
                        <div class="bg-gray-800 h-1.5 rounded-full w-2/3 absolute top-0 left-0 animate-progress"></div>
                    </div>
                </div>

                <!-- Error State -->
                <div id="errorState" class="hidden flex-grow flex flex-col items-center justify-center text-gray-600">
                    <i class="ph ph-warning-circle text-4xl mb-2"></i>
                    <p class="text-sm font-medium text-center px-4" id="errorMessage">An error occurred.</p>
                </div>

                <!-- Output Content -->
                <div id="outputContent" class="hidden flex-grow overflow-y-auto markdown-body text-sm pr-2">
                    <!-- Markdown will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Core System Prompt defining the AI's behavior based on user rules
        const SYSTEM_PROMPT = `Your goal is to improve and simplify the user's rough draft, thought, or idea. You are acting as a UX Analyst.

CRITICAL RULES YOU MUST FOLLOW EXACTLY:
1. Act as a UX Analyst: Provide insights referencing established UX principles, but keep the explanation highly accessible, concise, and simple to avoid overwhelming the reader.
2. 3rd Person POV: You must strictly use the third-person point of view (e.g., "The analysis shows," "Users often," "It is recommended"). Never use first or second person ("I", "we", "you").
3. Be Concise: Simplify the text significantly. Avoid long, overwhelming walls of text. Get straight to the point.
4. Formatting & Structure: Maintain the general structure of the user's idea, but improve its construction and clarity. 
5. Capitalization & Sentence Case: Ensure proper nouns (e.g., specific names, brands, places) are strictly and correctly capitalized. Otherwise, use sentence case.
6. Technicalities: If technical terms are mentioned, you MUST immediately provide a brief segue to explain the technicality in plain terms.
7. Fact-Checking: Integrate factual information and data from the web to support or expound on the user's idea.
8. Sources: If you utilize facts, data, or external references, you must include the sources at the bottom of the result.`;

        // UI State Elements
        const draftInput = document.getElementById('draftInput');
        const simplifyBtn = document.getElementById('simplifyBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const outputContent = document.getElementById('outputContent');
        const copyBtn = document.getElementById('copyBtn');

        // Render the initial prompt into the UI so the user can see/save it
        document.getElementById('promptDisplay').textContent = SYSTEM_PROMPT;

        function togglePromptSettings() {
            const panel = document.getElementById('promptSettings');
            panel.classList.toggle('hidden');
        }

        function clearInput() {
            draftInput.value = '';
            draftInput.focus();
        }

        function setUIState(state, message = "") {
            emptyState.classList.add('hidden');
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            outputContent.classList.add('hidden');
            copyBtn.classList.add('hidden');
            simplifyBtn.disabled = false;
            simplifyBtn.classList.remove('opacity-75', 'cursor-not-allowed');

            if (state === 'empty') {
                emptyState.classList.remove('hidden');
            } else if (state === 'loading') {
                loadingState.classList.remove('hidden');
                simplifyBtn.disabled = true;
                simplifyBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else if (state === 'error') {
                errorState.classList.remove('hidden');
                errorMessage.textContent = message;
            } else if (state === 'success') {
                outputContent.classList.remove('hidden');
                copyBtn.classList.remove('hidden');
            }
        }

        function copyOutput() {
            const textToCopy = outputContent.innerText;
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i class="ph-fill ph-check"></i> Copied!`;
                copyBtn.classList.replace('text-gray-700', 'text-gray-900');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.classList.replace('text-gray-900', 'text-gray-700');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            } finally {
                document.body.removeChild(tempTextArea);
            }
        }

        async function processDraft() {
            const text = draftInput.value.trim();
            if (!text) {
                setUIState('empty');
                return;
            }

            setUIState('loading');

            const apiKey = ""; // Let the environment handle the key injection
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: `Here is my rough draft:\n\n${text}` }] }],
                systemInstruction: {
                    parts: [{ text: SYSTEM_PROMPT }]
                },
                tools: [{ "google_search": {} }] // Enable Google Search for real-time fact checking
            };

            // Implementation of Exponential Backoff for retries
            let retries = 0;
            const maxRetries = 3;
            let delay = 1000;

            while (retries <= maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429) {
                        throw new Error('Rate limit exceeded');
                    }

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(`API Error: ${response.status} ${errData.error?.message || ''}`);
                    }

                    const result = await response.json();
                    
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        let generatedText = candidate.content.parts[0].text;
                        
                        // Extract grounding sources if available from the search tool
                        let sourcesMarkdown = "";
                        const groundingMetadata = candidate.groundingMetadata;
                        if (groundingMetadata && groundingMetadata.groundingAttributions) {
                            const sources = groundingMetadata.groundingAttributions
                                .map(attribution => ({
                                    uri: attribution.web?.uri,
                                    title: attribution.web?.title,
                                }))
                                .filter(source => source.uri && source.title);
                            
                            if (sources.length > 0) {
                                // Add a divider if the model didn't already format its own sources block
                                if (!generatedText.toLowerCase().includes("sources:")) {
                                    sourcesMarkdown = "\n\n---\n**Sources & references:**\n";
                                } else {
                                    sourcesMarkdown = "\n"; // Just append to the existing list if possible
                                }
                                
                                // Deduplicate URLs to keep the UI clean
                                const uniqueSources = [];
                                const seenUris = new Set();
                                for (const src of sources) {
                                    if (!seenUris.has(src.uri)) {
                                        seenUris.add(src.uri);
                                        uniqueSources.push(src);
                                    }
                                }
                                
                                uniqueSources.forEach(source => {
                                    sourcesMarkdown += `* [${source.title}](${source.uri})\n`;
                                });
                            }
                        }

                        // Combine the AI text with the extracted sources
                        const finalText = generatedText + sourcesMarkdown;
                        
                        // Parse markdown using marked.js
                        outputContent.innerHTML = marked.parse(finalText);
                        
                        // Apply link styling dynamically to markdown output
                        const links = outputContent.querySelectorAll('a');
                        links.forEach(link => {
                            link.classList.add('text-blue-600', 'hover:underline');
                            link.setAttribute('target', '_blank');
                            link.setAttribute('rel', 'noopener noreferrer');
                        });

                        setUIState('success');
                        return; // Success, exit loop
                    } else {
                        throw new Error('Unexpected response format from AI.');
                    }

                } catch (error) {
                    if (error.message.includes('Rate limit') && retries < maxRetries) {
                        retries++;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2; // Exponential backoff
                    } else {
                        setUIState('error', `Failed to process draft: ${error.message}`);
                        return; // Exit on hard error or max retries
                    }
                }
            }
        }

        // Allow Ctrl+Enter, Cmd+Enter, or Alt+Enter to trigger the simplification
        draftInput.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey || e.altKey) && e.key === 'Enter') {
                processDraft();
            }
        });
    </script>
</body>
</html>
